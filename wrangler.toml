name = "taky-tracker"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# Create the KV namespace in the Cloudflare dashboard and replace the id below.
# (Dashboard bindings can also be set under Pages > Settings > Bindings.)
[[kv_namespaces]]
binding = "MILESTONES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
